# Only images the import gate signed may run. The key is the gate's public key,
# filled in by up.sh. There is no transparency log inside the enclave, so
# verification relies on the key alone.
apiVersion: policies.kyverno.io/v1
kind: ImageValidatingPolicy
metadata:
  name: require-gate-signature
spec:
  webhookConfiguration:
    timeoutSeconds: 15
  evaluation:
    background:
      enabled: false
  validationActions: [Deny]
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ['']
        apiVersions: ['v1']
        operations: ['CREATE', 'UPDATE']
        resources: ['pods']
    # kube-system runs the k3s system images from the airgap tarball, which
    # never pass through the gate. lab-probes holds the unsigned probes that
    # verify.sh uses to test the network.
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values: [kube-system, kyverno, lab-probes]
  matchImageReferences:
    - glob: '*'
  # The enclave registry speaks plain http.
  credentials:
    allowInsecureRegistry: true
  attestors:
    - name: gate
      cosign:
        key:
          data: |
__PUBLIC_KEY__
        ctlog:
          insecureIgnoreTlog: true
          insecureIgnoreSCT: true
  # Init containers are named too. The default "required" setting refuses them
  # anyway, but with a message that does not say why.
  validations:
    - expression: >-
        images.containers.map(image, verifyImageSignatures(image, [attestors.gate])).all(e, e > 0) &&
        (!has(images.initContainers) ||
         images.initContainers.map(image, verifyImageSignatures(image, [attestors.gate])).all(e, e > 0))
      message: 'image is not signed by the import gate'
