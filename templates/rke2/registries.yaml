# Where every node pulls container images from.
# Copy to /etc/rancher/rke2/registries.yaml on every node, before the first
# start. REPLACE registry.enclave.example:5000 with your enclave registry.
#
# Any image name, also docker.io/... or ghcr.io/..., is fetched from the enclave
# registry. Together with disable-default-registry-endpoint in config.yaml there
# is no way out.
mirrors:
  docker.io:
    endpoint: ["https://registry.enclave.example:5000"]
  "*":
    endpoint: ["https://registry.enclave.example:5000"]

configs:
  "registry.enclave.example:5000":
    tls:
      # The enclave CA certificate. REPLACE the path if yours differs.
      # Do not use insecure_skip_verify: the registry gets a real certificate.
      ca_file: /etc/pki/enclave/ca.crt
