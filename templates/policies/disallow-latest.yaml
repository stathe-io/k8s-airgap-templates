# Checks that no image uses the latest tag, or no tag at all.
#
# Fill in: nothing. Starts in Audit, which logs and blocks nothing.
# Apply:   see the README. Move to Deny only when the report is empty.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: disallow-latest
spec:
  validationActions: [Audit]
  matchConstraints:
    resourceRules:
      - apiGroups: ['']
        apiVersions: ['v1']
        operations: ['CREATE', 'UPDATE']
        resources: ['pods']
    # The platform's own namespaces. Add yours, and keep the list short.
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values: [kube-system, kyverno]
  validations:
    - expression: >-
        (object.spec.containers + object.spec.?initContainers.orValue([])).all(c,
        c.image.contains("@sha256:") || (c.image.split("/")[size(c.image.split("/")) - 1].contains(":") && !c.image.endsWith(":latest")))
      message: 'an image uses latest or has no tag'
