# Makes Kyverno trust the enclave CA. Without it Kyverno finds no signature in
# cosign's current format: it fetches OCI 1.1 referrers over https only, whatever
# allowInsecureRegistry says.
#
#   kubectl -n kyverno create configmap enclave-ca --from-file=ca.crt=<enclave-ca.crt>
#   kubectl -n kyverno patch deployment kyverno-admission-controller --patch-file kyverno-enclave-ca.yaml
spec:
  template:
    spec:
      containers:
        - name: kyverno
          env:
            - name: SSL_CERT_FILE
              value: /enclave-ca/ca.crt
          volumeMounts:
            - name: enclave-ca
              mountPath: /enclave-ca
              readOnly: true
      volumes:
        - name: enclave-ca
          configMap:
            name: enclave-ca
